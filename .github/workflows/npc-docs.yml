name: NPC developer examples
on:
  pull_request:
    paths: ['files/npc/**', 'examples/npc/**', 'reference/libraries/npc/**', 'tools/npc_guide_snippets.py', '.github/workflows/npc-docs.yml']
  push:
    branches: [main]
    paths: ['files/npc/**', 'examples/npc/**', 'reference/libraries/npc/**', 'tools/npc_guide_snippets.py', '.github/workflows/npc-docs.yml']
permissions:
  contents: read
  packages: read
jobs:
  example:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
      - run: gradle -p examples/npc run checkSnippets --no-daemon
